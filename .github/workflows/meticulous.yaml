# Workflow for building the frontend and running Meticulous tests against static assets
name: Meticulous

# Important: this needs to run on pushes to main AND on pull requests, plus
# workflow_dispatch so Meticulous can trigger a run on the base commit if needed.
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

# Required for Meticulous to post/update the status check and PR comment.
permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  test:
    name: Meticulous
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # Marks this build as one Meticulous will test, so app code can opt out
        # of retry-heavy data fetches that have no recorded response during replay.
        env:
          METICULOUS_BUILD: "true"
        run: npm run build

      - name: Run Meticulous tests
        uses: alwaysmeticulous/report-diffs-action/upload-assets@v1
        with:
          api-token: ${{ secrets.METICULOUS_API_TOKEN }}
          app-directory: "dist"
